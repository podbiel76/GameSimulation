version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: geotactical_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: geotactical
      POSTGRES_USER: geotactical
      POSTGRES_PASSWORD: geotactical
    ports:
      - "5432:5432"
    volumes:
      - geotactical_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geotactical -d geotactical"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  geotactical_pgdata:
